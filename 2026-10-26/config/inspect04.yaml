# inspect04: same settings as inspect03, trained from scratch on the FIXED demo
# Cause found in inspect02/03: the Demonstration Recorder writes the decision-request record
# before the action is decided, so it holds the previous action (0 = "missing") for every image.
# Half the demo said "missing" -> BC pretraining loss could not go below ~0.59.
# tools/fix_demo.py keeps only the episode-end records (image + the action just decided).
#   0 missing, 1 OK cube, 2 OK prism (base 0/180), 3 OK prism (base 90/270), 4 defect
# Steps (Anaconda Prompt, from the Unity project folder):
#   conda activate mlagents
#   python tools/fix_demo.py Demos/InspectColorDemo.demo Demos/InspectColorDemoFixed.demo
#   mlagents-learn config/inspect04.yaml --run-id=inspect04
behaviors:
  Inspect:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: nature_cnn
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Demos/InspectColorDemoFixed.demo
      strength: 1.0
      steps: 0
      batch_size: 128
      num_epoch: 10
    max_steps: 30000
    time_horizon: 8
    summary_freq: 500
    checkpoint_interval: 1000
    keep_checkpoints: 10

# baseinspect05: base hole type + direction, 3 classes (0 square, 1 prism 0/180 deg, 2 prism 90/270 deg)
# Same method as baseinspect04 (behavioral cloning + PPO). Behavior Parameters Branch 0 Size = 3.
# baseinspect04 (2 classes) stalled at ~75%: the prism hole has two looks (wide / tall) that had to map to one answer.
# The demo file is recorded with Behavior Type = Heuristic Only (always the correct answer),
# so behavioral cloning works like supervised learning on labeled images.
# PPO's reward is kept as well; the BC term keeps the policy anchored (no collapse like baseinspect02).
# JigCamera orthographic size 0.03 (same as baseinspect02/03).
# Demo file: <project>/Demos/BaseInspect3Demo.demo (Demonstration Directory = Demos, outside Assets).
# Run from the Unity project folder:
#   conda activate mlagents
#   mlagents-learn config/baseinspect05.yaml --run-id=baseinspect05
behaviors:
  BaseInspect:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 1024
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: nature_cnn
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    behavioral_cloning:
      demo_path: Demos/BaseInspect3Demo.demo
      strength: 1.0
      steps: 0
      batch_size: 128
      num_epoch: 3
    max_steps: 15000
    time_horizon: 8
    summary_freq: 500
    checkpoint_interval: 1000
    keep_checkpoints: 10
